<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Numio · IA v2 — proposed structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.94 0.005 95); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  a { cursor: pointer; }
  code { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="numio-shell-v2.jsx"></script>

<script type="text/babel" src="page-inbox.jsx"></script>
<script type="text/babel" src="page-usage.jsx"></script>
<script type="text/babel" src="page-resources.jsx"></script>
<script type="text/babel" src="page-recommendations.jsx"></script>
<script type="text/babel" src="page-autopilot.jsx"></script>
<script type="text/babel" src="page-tag-governance.jsx"></script>
<script type="text/babel" src="page-budgets.jsx"></script>
<script type="text/babel" src="page-policies.jsx"></script>
<script type="text/babel" src="page-ingestion.jsx"></script>

<script type="text/babel">
const { useState: useStateApp } = React;

const DEFAULTS = /*EDITMODE-BEGIN*/{
  "showChat": true
}/*EDITMODE-END*/;

function Framed({ activePage, children, showChat }) {
  return (
    <div style={{ width: "100%", height: "100%", display: "flex", flexDirection: "column" }}>
      <NumioShellV2 activePage={activePage} chatCollapsed={!showChat}>
        <div style={{ flex: 1, overflow: "auto" }}>
          {children}
        </div>
      </NumioShellV2>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(DEFAULTS);

  return (
    <>
      <DesignCanvas
        title="Numio · IA v2 — proposed structure"
        subtitle="Reorganized sidebar (4 intent-led groups), slim top bar, no Overview, Feed → Inbox, merged Usage page, first-class Recommendations / Autopilot / Tag Governance / Budgets / Policies."
      >
        <DCSection id="work" title="Work — what needs attention today">
          <DCArtboard id="inbox" label="Inbox · /inbox  (default landing)" width={1440} height={900}>
            <Framed activePage="inbox" showChat={tweaks.showChat}>
              <InboxPage />
            </Framed>
          </DCArtboard>
        </DCSection>

        <DCSection id="understand" title="Understand — read-only analytics">
          <DCArtboard id="usage-cloud" label="Usage · Cloud tab · /usage" width={1440} height={900}>
            <Framed activePage="usage" showChat={tweaks.showChat}>
              <UsagePage initialScope="cloud" />
            </Framed>
          </DCArtboard>

          <DCArtboard id="usage-ai" label="Usage · AI tab · /usage" width={1440} height={900}>
            <Framed activePage="usage" showChat={tweaks.showChat}>
              <UsagePage initialScope="ai" />
            </Framed>
          </DCArtboard>

          <DCArtboard id="resources" label="Resources · /resources" width={1440} height={900}>
            <Framed activePage="resources" showChat={tweaks.showChat}>
              <ResourcesPage />
            </Framed>
          </DCArtboard>
        </DCSection>

        <DCSection id="optimize" title="Optimize — act to reduce cost">
          <DCArtboard id="recommendations" label="Recommendations · /recommendations  (new)" width={1440} height={900}>
            <Framed activePage="recommendations" showChat={tweaks.showChat}>
              <RecommendationsPage />
            </Framed>
          </DCArtboard>

          <DCArtboard id="recommendations-autopilot" label="Recommendations · Send-to-Autopilot confirmation" width={1440} height={900}>
            <Framed activePage="recommendations" showChat={tweaks.showChat}>
              <RecommendationsPage showAutopilotModal />
            </Framed>
          </DCArtboard>

          <DCArtboard id="autopilot" label="Autopilot · /autopilot  (new)" width={1440} height={900}>
            <Framed activePage="autopilot" showChat={tweaks.showChat}>
              <AutopilotPage />
            </Framed>
          </DCArtboard>

          <DCArtboard id="autopilot-history" label="Autopilot · History tab (audit log)" width={1440} height={900}>
            <Framed activePage="autopilot" showChat={tweaks.showChat}>
              <AutopilotPage initialTab="history" />
            </Framed>
          </DCArtboard>

          <DCArtboard id="autopilot-new" label="Autopilot · + New rule picker" width={1440} height={900}>
            <Framed activePage="autopilot" showChat={tweaks.showChat}>
              <AutopilotPage showNewRule />
            </Framed>
          </DCArtboard>
        </DCSection>

        <DCSection id="govern" title="Govern — guardrails &amp; policy">
          <DCArtboard id="tag-governance" label="Tag Governance · Resources tab" width={1440} height={900}>
            <Framed activePage="tag-governance" showChat={tweaks.showChat}>
              <TagGovernancePage />
            </Framed>
          </DCArtboard>

          <DCArtboard id="tag-governance-schema" label="Tag Governance · Tag schema tab" width={1440} height={900}>
            <Framed activePage="tag-governance" showChat={tweaks.showChat}>
              <TagGovernancePage initialTab="schema" />
            </Framed>
          </DCArtboard>

          <DCArtboard id="budgets" label="Budgets · /budgets  (new)" width={1440} height={900}>
            <Framed activePage="budgets" showChat={tweaks.showChat}>
              <BudgetsPage />
            </Framed>
          </DCArtboard>

          <DCArtboard id="policies" label="Policies · /policies  (new)" width={1440} height={900}>
            <Framed activePage="policies" showChat={tweaks.showChat}>
              <PoliciesPage />
            </Framed>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin" title="Admin (collapsed by default in sidebar)">
          <DCArtboard id="ingestion" label="Data Ingestion · /ingestion" width={1440} height={900}>
            <Framed activePage="ingestion" showChat={tweaks.showChat}>
              <IngestionPage />
            </Framed>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Chrome">
          <TweakToggle
            label="Show chat rail"
            value={tweaks.showChat}
            onChange={v => setTweak("showChat", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
