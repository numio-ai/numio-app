<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Numio · Tag Governance — full state spec</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tags-shared.jsx"></script>
<script type="text/babel" src="numio-shell.jsx"></script>
<script type="text/babel" src="tags-final-v2.jsx"></script>
<script type="text/babel" src="tags-states.jsx"></script>
<script type="text/babel" src="tags-schema.jsx"></script>
<script type="text/babel" src="tags-flows.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

function App() {
  return (
    <DesignCanvas>

      {/* ============================================================
          PROPOSAL — happy path
          ============================================================ */}
      <DCSection
        id="happy"
        title="The proposal — happy path"
        subtitle="Tag Governance inside the real Numio shell. Same heatmap, same row-expand, but now living at /tag-governance with the SlimTopBar, OverviewSidebar, and the global Ask Numio rail.">

        <DCArtboard id="resources-tab" label="Resources tab · default state" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <TagGovernanceContent onOpenChat={() => {}} />
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="schema-tab" label="Schema tab · keys, values, AWS Org sync" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <SchemaTabContent />
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="chat-open" label="With Ask Numio open" width={1680} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={false} chatConversation="tag" onToggleChat={() => {}}>
            <TagGovernanceContent onOpenChat={() => {}} />
          </NumioShell>
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          ONBOARDING & EMPTY STATES
          ============================================================ */}
      <DCSection
        id="onboarding"
        title="Onboarding · first run"
        subtitle="What a brand-new Numio workspace sees on this page. We auto-seed the schema by scanning connected cloud accounts.">

        <DCArtboard id="onboarding-scan" label="Scanning · 'learning your tag landscape'" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <OnboardingState />
          </NumioShell>
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          DATA STATES — loading, error, viewer
          ============================================================ */}
      <DCSection
        id="data-states"
        title="Loading · error · permissions"
        subtitle="The screens users see when the data isn't ready, the API is down, or they're a viewer.">

        <DCArtboard id="loading" label="Loading · skeleton" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <LoadingState />
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="error" label="Error · API unavailable" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <ErrorState />
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="viewer" label="Viewer mode · read-only" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
              <ViewerBanner />
              <div style={{ flex: 1, minHeight: 0, position: "relative", filter: "saturate(0.85)", pointerEvents: "none" }}>
                <TagGovernanceContent onOpenChat={() => {}} />
              </div>
            </div>
          </NumioShell>
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          WRITE FLOWS
          ============================================================ */}
      <DCSection
        id="write-flows"
        title="Write flows · confirm, undo, failure"
        subtitle="Smart write model: single cells go through immediately; bulk + prod + spend &gt; $1k trigger confirm. Failures, undo, and audit fall back consistently.">

        <DCArtboard id="risky-write" label="Risky-write confirm · prod + bulk" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ position: "relative", height: "100%" }}>
              <TagGovernanceContent onOpenChat={() => {}} />
              <RiskyWriteModal onClose={() => {}} />
            </div>
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="undo-toast" label="Undo toast · 5-min window" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ position: "relative", height: "100%" }}>
              <TagGovernanceContent onOpenChat={() => {}} />
              <UndoToast />
            </div>
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="partial-failure" label="Partial failure · 47/50 applied" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ position: "relative", height: "100%" }}>
              <TagGovernanceContent onOpenChat={() => {}} />
              <PartialFailureToast />
            </div>
          </NumioShell>
        </DCArtboard>

        <DCArtboard id="recent-changes" label="Recent changes · inline strip + audit link" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
              <div style={{ flex: 1, minHeight: 0, position: "relative" }}>
                <TagGovernanceContent onOpenChat={() => {}} />
              </div>
              <RecentChangesStrip />
            </div>
          </NumioShell>
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          SCHEMA · AWS ORG CONFLICT
          ============================================================ */}
      <DCSection
        id="schema-flows"
        title="Schema flows · AWS Org sync"
        subtitle="What happens when Numio's schema and an AWS Organizations tag policy disagree.">
        <DCArtboard id="aws-conflict" label="AWS Org conflict · resolution modal" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ position: "relative", height: "100%" }}>
              <SchemaTabContent />
              <AwsOrgConflictModal onClose={() => {}} />
            </div>
          </NumioShell>
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          AI SETTINGS
          ============================================================ */}
      <DCSection
        id="ai-settings"
        title="AI autonomy · the three levels"
        subtitle="From the global Settings or the page-level sliders icon. Sets the default for tag suggestions and auto-fixes.">
        <DCArtboard id="autonomy" label="Suggest / Auto-fix safe / Autopilot" width={760} height={900}>
          <AIAutonomyPanel />
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          SEARCH
          ============================================================ */}
      <DCSection
        id="search"
        title="Natural-language search"
        subtitle="The page-level search box parses free-text into resource + tag-key + tag-value filters. ⌘↵ opens the same query in Ask Numio chat.">
        <DCArtboard id="search-dd" label="Search dropdown · parsed query" width={1440} height={900}>
          <NumioShell page="Tag Governance" chatCollapsed={true} onToggleChat={() => {}}>
            <div style={{ position: "relative", height: "100%" }}>
              <TagGovernanceContent onOpenChat={() => {}} />
              <SearchDropdown />
            </div>
          </NumioShell>
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          MOBILE
          ============================================================ */}
      <DCSection
        id="mobile"
        title="Mobile · read-only summary"
        subtitle="Desktop-first. On mobile we redirect to a status view with KPIs + activity, and a 'send me the desktop link' action.">
        <DCArtboard id="mobile-redirect" label="iPhone · 'use desktop'" width={390} height={844}>
          <MobileScreen />
        </DCArtboard>
      </DCSection>

      {/* ============================================================
          DECISION LOG
          ============================================================ */}
      <DCSection
        id="decisions"
        title="Decision log · ready for handoff"
        subtitle="Every decision, with the assumption it carries and where it shows up in the design.">
        <DCArtboard id="log" label="Decisions + assumptions + open items" width={1080} height={1240}>
          <DecisionLog />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

// ============================================================
// DECISION LOG ARTBOARD
// ============================================================
function DecisionLog() {
  const D = ({ tag, title, decision, where }) => (
    <div style={{
      display: "grid", gridTemplateColumns: "100px 1fr 1fr 200px", gap: 14,
      padding: "14px 18px", borderBottom: "1px solid #efefef", alignItems: "flex-start",
    }}>
      <span style={{
        fontSize: 10, fontWeight: 700, color: "#fff", background: "#111827",
        padding: "3px 8px", borderRadius: 4, letterSpacing: "0.04em",
        justifySelf: "start", alignSelf: "start",
      }}>{tag}</span>
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#111827", marginBottom: 4 }}>{title}</div>
      </div>
      <div style={{ fontSize: 12.5, color: "#374151", lineHeight: 1.55 }}>{decision}</div>
      <div style={{ fontSize: 11.5, color: "#6b7280", lineHeight: 1.5 }}>{where}</div>
    </div>
  );

  return (
    <div style={{ height: "100%", overflow: "auto", padding: "28px 0", fontFamily: "Inter, system-ui, sans-serif", color: "#111827" }}>
      <div style={{ padding: "0 28px 20px" }}>
        <div style={{ fontSize: 10.5, color: "#9ca3af", marginBottom: 6, letterSpacing: "0.05em", fontWeight: 600 }}>v5 · DECISION LOG</div>
        <h1 style={{ fontSize: 22, fontWeight: 600, margin: "0 0 6px", letterSpacing: "-0.02em" }}>Decisions for handoff</h1>
        <p style={{ fontSize: 12.5, color: "#6b7280", margin: 0, lineHeight: 1.55 }}>
          Locked decisions from the design pass + assumptions the backend needs to confirm. Anything marked <span style={{ fontSize: 10, fontWeight: 700, color: "#d97706", background: "#fffbeb", padding: "1px 5px", borderRadius: 3 }}>NEEDS CONFIRM</span> is a backend dependency I can't verify from the frontend.
        </p>
      </div>

      <div style={{
        display: "grid", gridTemplateColumns: "100px 1fr 1fr 200px", gap: 14,
        padding: "8px 18px", borderBottom: "2px solid #111827",
        fontSize: 9.5, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.08em",
      }}>
        <span>Topic</span><span>Question</span><span>Decision</span><span>Where it lives</span>
      </div>

      <D tag="WRITE" title="When does an edit hit the cloud?"
        decision="Smart — single cells write immediately on pick. Bulk operations queue + show diff + require Apply."
        where="Resources tab · cell popover (immediate) · bulk bar (queued)" />
      <D tag="CONFIRM" title="When do we require dry-run confirmation?"
        decision="Risky-only: any change touching env:production OR aggregating >$1k/mo spend. Otherwise writes go through."
        where="Risky-write modal · triggers from cell or bulk apply" />
      <D tag="PERMS" title="Who can edit?"
        decision="Bound to user.role (admin vs viewer from AuthContext). The 'Finance/Technical/Data' RoleContext is for view personas, not permissions."
        where="Viewer banner artboard. Edit affordances hidden / disabled for non-admin." />
      <D tag="SCHEMA" title="Where does schema editing live?"
        decision="Second tab inside /tag-governance: 'Resources | Schema | Audit log'. The existing /govern/tags sidebar item redirects here."
        where="Schema tab artboard" />
      <D tag="AI" title="How autonomous is the agent?"
        decision="Three configurable levels: Suggest only · Auto-fix safe (default, drift + >90% peer match) · Autopilot for new resources. All exclude prod by default."
        where="AI autonomy panel artboard" />
      <D tag="FAIL" title="What if 47/50 writes succeed?"
        decision="Dark toast at the bottom: 'Applied 47/50, 3 failed.' Buttons: 'View details in audit log' + 'Retry 3 failed'."
        where="Partial-failure toast artboard" />
      <D tag="UNDO" title="How do users reverse a change?"
        decision="Toast undo for 5 min. After that, revert from /govern/audit per entry. Every change is logged regardless."
        where="Undo toast artboard + audit log link in recent-changes strip" />
      <D tag="CLOUD" title="What clouds in v1?"
        decision="AWS only. GCP/Azure are post-v1; UI must not assume cross-cloud constructs yet."
        where="All artboards. AWS Org sync is AWS-specific by design." />
      <D tag="MOBILE" title="What about phones?"
        decision="Desktop-first. Mobile gets a summary card screen with KPIs + recent activity + 'email me the desktop link' CTA."
        where="Mobile redirect artboard (390×844)" />
      <D tag="ONBOARD" title="What does a new user see?"
        decision="Auto-seed: scan connected AWS accounts, propose a schema based on discovered tags + AWS Org policies. User reviews and accepts."
        where="Onboarding · scanning artboard" />
      <D tag="SEARCH" title="What does the search box do?"
        decision="Natural language. Parses into resource + tag-key + tag-value chips. ⌘↵ pipes the same query into Ask Numio chat."
        where="Search dropdown artboard" />
      <D tag="AUDIT" title="Where do users see history?"
        decision="Both — inline 'Recent changes' strip at the bottom of the heatmap (last 3) + 'View full audit log' link to /govern/audit."
        where="Recent-changes-strip artboard" />

      {/* Assumptions */}
      <div style={{ padding: "24px 28px 8px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Backend assumptions · need confirm</div>
      </div>
      <Assumption tag="API" text="The dry-run preview needs a backend endpoint that takes (resource_ids, tag_changes) → returns (affected_resources, total_spend, prod_count, validation_errors). Doesn't write." />
      <Assumption tag="API" text="Bulk write endpoint must report per-resource status so the partial-failure toast can show 47/50. Suggested: POST /api/v1/tags/apply returns { succeeded: [], failed: [{resource_id, reason}] }." />
      <Assumption tag="API" text="Undo: every tag.set audit event needs to carry the previous value so a 'revert' button has a target. Numio's audit log probably already has this — confirm." />
      <Assumption tag="API" text="Auto-seed onboarding: needs a 'scan cloud and propose schema' endpoint that returns discovered keys + sample values + coverage stats. Could reuse the existing compliance summary infra." />
      <Assumption tag="API" text="AWS Org sync: read AWS Organizations tag policies via the existing cloud integration. Conflict detection runs server-side and exposes a list of (key, numio_values, aws_values, recommended_resolution)." />
      <Assumption tag="DATA" text="The 'discovered' tags in onboarding/schema views need a flag on the backend separating 'in canonical schema' vs 'seen in cloud but not promoted'." />
      <Assumption tag="DATA" text="Confidence score per AI suggestion (used to gate auto-fix). Frontend assumes a 0–1 numeric. Confirm or define." />
      <Assumption tag="PERMS" text="user.role values are 'admin' / 'viewer' — confirm there's no third tier (editor?) and that 'admin' is the gate for tag.write." />

      <div style={{ padding: "16px 28px 4px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Still to spec (small)</div>
        <ul style={{ paddingLeft: 18, margin: 0, fontSize: 12.5, color: "#374151", lineHeight: 1.7 }}>
          <li>Keyboard shortcuts: <code style={kbdLog}>j/k</code> row nav · <code style={kbdLog}>↵</code> expand · <code style={kbdLog}>e</code> jump to first missing cell · <code style={kbdLog}>⌘K</code> Ask Numio · <code style={kbdLog}>⌘↵</code> apply</li>
          <li>Heatmap: sticky column header when many rows are expanded (heatmap can scroll past the head)</li>
          <li>Discovered-tag "promote to schema" mini-flow (modal? side panel? inline?)</li>
          <li>Bulk-pending visual: when cells are queued (not yet applied), what color/treatment?</li>
          <li>Cell popover behavior on outside-click vs Esc (should commit or discard?)</li>
        </ul>
      </div>
    </div>
  );
}

function Assumption({ tag, text }) {
  return (
    <div style={{
      display: "flex", gap: 12, padding: "10px 28px",
      borderTop: "1px solid #efefef", fontSize: 12, color: "#374151",
    }}>
      <span style={{
        fontSize: 9, fontWeight: 700, color: "#d97706", background: "#fffbeb",
        border: "1px solid #fde68a", padding: "2px 6px", borderRadius: 4,
        letterSpacing: "0.04em", flexShrink: 0, alignSelf: "flex-start",
      }}>{tag}</span>
      <span style={{ lineHeight: 1.55 }}>{text}</span>
    </div>
  );
}

const kbdLog = {
  fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5,
  background: "#f3f4f6", color: "#374151",
  border: "1px solid #efefef",
  padding: "1px 5px", borderRadius: 3,
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
